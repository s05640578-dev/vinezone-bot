<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VineZone - Video ko'rish</title>
    <script src="https://telegram.org"></script>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 15px; margin-top: 15px; }
        .balance { font-size: 26px; font-weight: bold; color: #00e676; margin: 5px 0; }
        iframe { width: 100%; height: 215px; border-radius: 12px; border: none; }
        .btns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
        button { background: #2979ff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        button.active { background: #00c853; }
    </style>
</head>
<body>
    <h3>🎥 VineZone — Video ko'rib pul ishlang</h3>
    <div id="player"></div>
    <div class="btns" id="video-buttons"></div>

    <div class="card">
        <div>Sizning balansingiz:</div>
        <div class="balance"><span id="bal">0</span> so'm</div>
        <p id="status" style="color: #aaa; font-size: 14px;">Videoni boshlash uchun Play tugmasini bosing</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = "{{USER_ID}}";
        const videos = {{VIDEOS_JSON}};
        let player;
        let timer = null;

        const btnContainer = document.getElementById("video-buttons");
        videos.forEach((v, idx) => {
            const btn = document.createElement("button");
            btn.innerText = v.title;
            if (idx === 0) btn.classList.add("active");
            btn.onclick = () => {
                document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                player.loadVideoById(v.id);
            };
            btnContainer.appendChild(btn);
        });

        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videos[0].id,
                playerVars: { 'playsinline': 1, 'controls': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                document.getElementById("status").innerText = "🟢 Hisoblanmoqda... (har 5 soniyada)";
                if (!timer) timer = setInterval(sendTick, 5000);
            } else {
                document.getElementById("status").innerText = "⏸ Video to'xtatildi.";
                clearInterval(timer);
                timer = null;
            }
        }

        async function sendTick() {
            const res = await fetch('/api/tick', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            const data = await res.json();
            if (data.status === "ok") {
                document.getElementById("bal").innerText = data.balance.toLocaleString();
            }
        }
    </script>
</body>
</html>
